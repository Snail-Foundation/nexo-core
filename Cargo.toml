[package]
name = "nexo-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Shared domain and synchronization protocol for Nexo"
license = "MIT"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v7", "serde"] }
